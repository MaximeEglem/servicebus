name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p dist
          SHORT_COMMIT="${COMMIT:0:7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X main.version=${VERSION} -X main.gitCommit=${SHORT_COMMIT} -X main.buildDate=${BUILD_DATE}"

          build_and_package_unix() {
            local goos="$1"
            local goarch="$2"
            local name="sb_${VERSION}_${goos}_${goarch}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "dist/sb" ./cmd/sb
            tar -C dist -czf "dist/${name}.tar.gz" sb
            rm -f dist/sb
          }

          build_and_package_windows() {
            local name="sb_${VERSION}_windows_amd64"
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o "dist/sb.exe" ./cmd/sb
            tar -C dist -czf "dist/${name}.tar.gz" sb.exe
            rm -f dist/sb.exe
          }

          build_and_package_unix darwin amd64
          build_and_package_unix darwin arm64
          build_and_package_unix linux amd64
          build_and_package_unix linux arm64
          build_and_package_windows

          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
